name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    name: Examples validate against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/validate_examples.py
